<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
		<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />

		<title>Simulador de horarios</title>
		<!-- Required meta tags -->
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>

		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
		<link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css" />

		<style>
			/* ----- MODAL STYLE ----- */

			.modal.left .modal-dialog {
			position: fixed;
			right: 0;
			top: 62px;
			margin: auto;
			width: 345px;
			height: 469px;
			-webkit-transform: translate3d(0%, 0, 0);
			-ms-transform: translate3d(0%, 0, 0);
			-o-transform: translate3d(0%, 0, 0);
			transform: translate3d(0%, 0, 0);
		}

		.modal.left .modal-content {
			height: 100%;
			overflow-y: auto;
		}

		.modal.right .modal-body {
			padding: 15px 15px 80px;
		}

		.modal.right.fade .modal-dialog {
			left: -320px;
			-webkit-transition: opacity 0.3s linear, left 0.3s ease-out;
			-moz-transition: opacity 0.3s linear, left 0.3s ease-out;
			-o-transition: opacity 0.3s linear, left 0.3s ease-out;
			transition: opacity 0.3s linear, left 0.3s ease-out;
		}

		.modal.right.fade.show .modal-dialog {
			right: 0;
		}

		.modal-content {
			border-radius: 0;
			border: none;
		}

		.modal-header {
			border-bottom-color: #eeeeee;
			background-color: #fafafa;
		}

		#userModal .modal-dialog {
			position: fixed;
			right: 0;
			top: 62px;
			margin: auto;
			width: 345px;
			height: 365px;
			-webkit-transform: translate3d(0%, 0, 0);
			-ms-transform: translate3d(0%, 0, 0);
			-o-transform: translate3d(0%, 0, 0);
			transform: translate3d(0%, 0, 0);
		}
		</style>

		
	</head>
	<body>
		<!--Navbar-->
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<a class="navbar-brand" href="#">Simulador de horarios</a>
			<button
				class="navbar-toggler"
				type="button"
				data-bs-toggle="collapse"
				data-bs-target="#navbarText"
				aria-controls="navbarText"
				aria-expanded="false"
				aria-label="Toggle navigation"
			>
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse p-0" id="navbarText">
				<ul class="navbar-nav me-auto" id='navbar'>
					
				</ul>
				<span class="navbar-text p-0">
					<a type="button" id="userbtn" class="btn btn-primary"><i class="fa fa-user fa-2x" aria-hidden="true"></i></a>
				</span>
			</div>
		</nav>

		<!-- Ventana -->
		<div class="row m-2 mt-4">
			<!-- Sidebar -->
			<div class="col-2">
				<a name="" id="" class="btn btn-primary" href="/crear" role="button"
					><i class="fa fa-calendar-plus-o" aria-hidden="true"></i></i>&nbsp Nuevo
					calendario</a
				>
			</div>
			<!-- Contenido principal -->
			<div class="col">
				<h1><i class="fa fa-calendar" aria-hidden="true"></i> Mis calendarios</h1>
				<hr>
				<!-- Calendarios -->
				<div class="album py-5 bg-light">
					<div id="mensajeCalendarios" class="container">
						
						
						<div id="albumCalendarios" class="row">
							<!-- Aquí empiezan las tarjetas de cada calendario -->
							
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- Modales del usuario -->
		<div id="modalesUsuario">

		</div>
		
		

		

		<!-- Optional JavaScript -->
		<script src="home.js"></script>
		<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
