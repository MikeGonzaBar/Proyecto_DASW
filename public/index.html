<!DOCTYPE html>
<html lang="en">
	<head>
		<link
			rel="icon"
			type="image/png"
			href="./favicon-32x32.png"
			sizes="32x32"
		/>
		<link
			rel="icon"
			type="image/png"
			href="./favicon-16x16.png"
			sizes="16x16"
		/>

		<title>Simulador de Horarios</title>
		<!-- Required meta tags -->
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>

		<!-- Bootstrap CSS -->
		<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
		<link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css" />
	</head>
	<body>
		<!-- Navbar -->
		<nav class="navbar navbar-dark bg-primary flex-column flex-md-row align-items-stretch align-items-md-center">
			<a class="navbar-brand mb-2 mb-md-0 me-md-auto" href="#">Simulador de horarios</a>
			<form class="d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2" action="">
				<div>
					<small id="emailHelpId" class="form-text text-white m-0"
						>Correo electrónico</small
					>
					<input
						type="email"
						class="form-control"
						name="email"
						id="loginEmail"
						aria-describedby="emailHelpId"
						placeholder=""
					/>
				</div>
				<div>
					<small id="passwordHelpId" class="form-text text-white m-0"
						>Contraseña</small
					>
					<input
						type="password"
						class="form-control"
						name="password"
						id="loginPassword"
						placeholder=""
					/>
				</div>
				<button type="submit" class="btn btn-primary" id="loginSubmit">
					Iniciar sesión
				</button>
			</form>
		</nav>
		<div id="loginAlerts"></div>

		<!-- Contenido -->
		<div class="row align-items-center mx-0">
			<div class="col-12 col-lg py-4 px-3 px-lg-5 text-center">
				<h3>Planifica tus horarios de manera sencilla</h3>
				<img src="./img/Banner Index.png" alt="Index Banner" width="50%" />
			</div>

			<div class="col-12 col-lg-4 py-4 px-3 px-lg-5">
				<div>
					<h1 class="mb-3">Registrarte</h1>
				</div>
				<div>
					<form id="registerForm" class="w-100" action="">
						<div class="form-row mb-3">
							<div class="col-12 col-sm mb-3 mb-sm-0">
								<input
									type="text"
									name="name"
									id="registerNombre"
									class="form-control"
									placeholder="Nombre"
									required
								/>
							</div>
							<div class="col-12 col-sm">
								<input
									type="text"
									name="lastname"
									id="registerApellido"
									class="form-control"
									placeholder="Apellidos"
									required
								/>
							</div>
						</div>

						<input
							type="text"
							name="expediente"
							id="registerExpediente"
							class="form-control mb-3"
							placeholder="Expediente"
							required
						/>
						<input
							type="email"
							name="mail"
							id="registerEmail"
							class="form-control mb-3"
							placeholder="Correo electrónico"
							required
						/>
						<input
							type="password"
							name="pass1"
							id="registerPassword1"
							class="form-control mb-3"
							placeholder="Contraseña"
							required
						/>
						<input
							type="password"
							name="pass2"
							id="registerPassword2"
							class="form-control mb-3"
							placeholder="Confirmar contraseña"
							required
						/>
						<button
							type="button"
							id="registerSubmit"
							class="btn btn-primary float-end"
						>
							Registrarse
						</button>
					</form>
				</div>
				<div id="registerAlerts" class="row m-0 mt-3"></div>
			</div>
		</div>

		<!-- Optional JavaScript -->
		<script src="index.js"></script>
		<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
